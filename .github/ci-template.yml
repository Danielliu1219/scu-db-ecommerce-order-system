# Inactive template: enable under .github/workflows only with workflow permission.
name: Application checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: scu_ecommerce
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql+pymysql://root:ci-test-only@127.0.0.1:3306/scu_ecommerce
      TEST_DATABASE_URL: mysql+pymysql://root:ci-test-only@127.0.0.1:3306/scu_ecommerce_test
      JWT_SECRET: ci-test-only-ephemeral-signing-secret-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install -e backend --no-deps
      - run: python -m ruff check --config backend/pyproject.toml backend/app db tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
