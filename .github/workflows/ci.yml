name: Application checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: scu_ecommerce
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d scu_ecommerce"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/scu_ecommerce
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/scu_ecommerce_test
      JWT_SECRET: ci-test-only-ephemeral-signing-secret-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install -e backend --no-deps
      - run: python -m ruff check --config backend/pyproject.toml backend/app db tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
